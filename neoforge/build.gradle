plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

apply from: rootProject.file("gradle/scripts/publishing.gradle")
apply from: rootProject.file("gradle/scripts/maven-publishing.gradle")

dependencies {
    implementation "com.daqem.uilib:uilib-neoforge:${project.uilib_version}"
    implementation "org.snakeyaml:snakeyaml-engine:${project.yaml_version}"
    implementation "com.electronwill.night-config:toml:${project.toml_version}"
    implementation "com.electronwill.night-config:core:${project.toml_version}"
    implementation "blue.endless:jankson:${project.json5_version}"
    implementation("org.spongepowered:configurate-hocon:${project.hocon_version}") {
        exclude group: 'org.checkerframework'
    }

    shadowBundle "org.snakeyaml:snakeyaml-engine:${project.yaml_version}"
    shadowBundle "com.electronwill.night-config:toml:${project.toml_version}"
    shadowBundle "com.electronwill.night-config:core:${project.toml_version}"
    shadowBundle "blue.endless:jankson:${project.json5_version}"
    shadowBundle("org.spongepowered:configurate-hocon:${project.hocon_version}") {
        exclude group: 'org.checkerframework'
    }
}

neoForge {
    version = neoforge_version
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            data()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()

        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }