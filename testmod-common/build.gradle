plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'

    compileOnly(project(':common')) {
        capabilities {
            requireCapability "$group:$mod_id-common"
        }
    }

    implementation "com.daqem.uilib:uilib-common:${project.uilib_version}"
    implementation "org.snakeyaml:snakeyaml-engine:${project.yaml_version}"
    implementation "com.electronwill.night-config:toml:${project.toml_version}"
    implementation "com.electronwill.night-config:core:${project.toml_version}"
    implementation "blue.endless:jankson:${project.json5_version}"
    implementation("org.spongepowered:configurate-hocon:${project.hocon_version}") {
        exclude group: 'org.checkerframework'
    }
}

configurations {
    testmodCommonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    testmodCommonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    testmodCommonJava sourceSets.main.java.sourceDirectories.singleFile
    testmodCommonResources sourceSets.main.resources.sourceDirectories.singleFile
}